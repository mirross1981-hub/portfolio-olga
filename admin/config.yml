backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "img"

collections:
  - name: "works"
    label: "Кейсы"
    files:
      - name: "cases"
        label: "Все кейсы"
        file: "cases.json"
        fields:
          - label: "Кейсы"
            name: "works"
            widget: "list"
            fields:
              - { label: "Название", name: "title", widget: "string", required: true }
              - { label: "Теги", name: "tag", widget: "string", required: false }
              - { label: "Описание", name: "description", widget: "text", required: false }
              - { label: "Обложка (путь к файлу)", name: "cover", widget: "string", required: false }
              - label: "Экраны"
                name: "screens"
                widget: "list"
                required: false
                fields:
                  - { label: "Путь к картинке", name: "src", widget: "string", required: false }
                  - { label: "Описание", name: "alt", widget: "string", required: false }