backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "img"

collections:
  - name: "works"
    label: "Кейсы"
    format: "json"
    file: "cases.json"
    fields:
      - label: "Кейсы"
        name: "works"
        widget: "list"
        fields:
          - { label: "Название", name: "title", widget: "string" }
          - { label: "Теги", name: "tag", widget: "string" }
          - { label: "Описание", name: "description", widget: "text" }
          - { label: "Обложка", name: "cover", widget: "image" }
          - label: "Экраны"
            name: "screens"
            widget: "list"
            fields:
              - { label: "Картинка", name: "src", widget: "image" }
              - { label: "Описание", name: "alt", widget: "string" }